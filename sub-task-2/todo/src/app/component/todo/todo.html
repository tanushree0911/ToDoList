

<mat-drawer-container class="todo-app-container" [hasBackdrop]="true">
  
    <mat-drawer #drawer mode="over" position="end" class="edit-sidebar">
      <div class="drawer-header">
        <h2>Edit Task Details</h2>
        <button mat-icon-button (click)="drawer.close()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
  
      <div class="drawer-body">
        <app-edit-task 
          [task]="selectedTodo" 
          (save)="handleSave($event, drawer)" 
          (cancel)="drawer.close()">
        </app-edit-task>
      </div>
    </mat-drawer>
  
    <mat-drawer-content>
      <div class="main-content-wrapper">

        <div class="filter-section mat-elevation-z2">
            <mat-form-field appearance="outline" class="search-field">
              <mat-label>Filter by Title</mat-label>
              <input matInput 
                     placeholder="Enter keywords (e.g. 'delectus')" 
                     #filterInput
                     (keyup.enter)="applyTitleFilter(filterInput.value)">
              <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
          
            <div class="filter-actions">
              <button mat-flat-button 
                      color="primary" 
                      (click)="applyTitleFilter(filterInput.value)">
                Apply Filter
              </button>
              
              <button mat-stroked-button 
                      color="basic" 
                      (click)="resetFilter(filterInput)">
                Cancel / Reset
              </button>
            </div>
        </div>
        
        <!-- <div class="table-header-actions">
          <h1>Task Management</h1>
          <button mat-flat-button color="warn" 
                  [disabled]="!selection.hasValue()" 
                  (click)="deleteSelected()">
            <mat-icon>delete</mat-icon>
            Delete Selected ({{selection.selected.length}})
          </button>
        </div> -->
  
        <div class="mat-elevation-z8 table-responsive">
          <table mat-table [dataSource]="dataSource">
  
            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef>
                <!-- <mat-checkbox (change)="$event ? masterToggle() : null"
                              [checked]="selection.hasValue() && isAllSelected()"
                              [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox> -->
              </th>
              <td mat-cell *matCellDef="let row">
                <div class="action-cell-flex">
                  <mat-checkbox (click)="$event.stopPropagation()"
                                (change)="$event ? selection.toggle(row) : null"
                                [checked]="selection.isSelected(row)">
                  </mat-checkbox>
                  <button mat-icon-button color="primary" 
                          matTooltip="Edit Task"
                          (click)="onEditClick(row, drawer); $event.stopPropagation()">
                    <mat-icon>edit</mat-icon>
                  </button>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> ID </th>
              <td mat-cell *matCellDef="let row"> {{row.id}} </td>
            </ng-container>
  
            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef> Description </th>
              <td mat-cell *matCellDef="let row"> {{row.title}} </td>
            </ng-container>
  
            <ng-container matColumnDef="completed">
              <th mat-header-cell *matHeaderCellDef> Status </th>
              <td mat-cell *matCellDef="let row">
                <span class="status-chip" [class.completed]="row.completed">
                  {{row.completed ? 'Done' : 'Pending'}}
                </span>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="delete">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="warn" (click)="deleteSingle(row); $event.stopPropagation()">
                  <mat-icon>delete_outline</mat-icon>
                </button>
              </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
                (click)="selection.toggle(row)"
                class="clickable-row">
            </tr>
          </table>
  
          <div *ngIf="dataSource.data.length === 0" class="no-data">
            No tasks found.
          </div>
        </div>
      </div>
    </mat-drawer-content>
  
  </mat-drawer-container>
